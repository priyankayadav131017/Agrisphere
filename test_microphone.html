<!DOCTYPE html>
<html>
<head>
    <title>Microphone Test</title>
</head>
<body>
    <h1>Microphone Test</h1>
    <button id="testMic">Test Microphone</button>
    <p id="status">Click button to test microphone</p>
    <p id="result"></p>

    <script>
        document.getElementById('testMic').onclick = function() {
            const status = document.getElementById('status');
            const result = document.getElementById('result');
            
            // Check if speech recognition is supported
            if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
                status.textContent = "❌ Speech recognition not supported in this browser";
                return;
            }
            
            const SpeechRecognition = window.webkitSpeechRecognition || window.SpeechRecognition;
            const recognition = new SpeechRecognition();
            
            recognition.lang = 'hi-IN';
            recognition.continuous = false;
            recognition.interimResults = false;
            
            recognition.onstart = function() {
                status.textContent = "🎤 Listening... Speak now!";
            };
            
            recognition.onresult = function(event) {
                const transcript = event.results[0][0].transcript;
                result.textContent = "You said: " + transcript;
                status.textContent = "✅ Microphone working!";
            };
            
            recognition.onerror = function(event) {
                status.textContent = "❌ Error: " + event.error;
                if (event.error === 'not-allowed') {
                    result.textContent = "Please allow microphone permission in your browser";
                }
            };
            
            recognition.onend = function() {
                if (status.textContent.includes('Listening')) {
                    status.textContent = "❌ No speech detected";
                }
            };
            
            try {
                recognition.start();
            } catch (error) {
                status.textContent = "❌ Failed to start: " + error.message;
            }
        };
    </script>
</body>
</html>
